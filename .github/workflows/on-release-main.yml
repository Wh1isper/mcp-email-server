name: release-main

permissions:
  contents: read

on:
  release:
    types: [published]

jobs:
  verify-release-source:
    runs-on: ubuntu-24.04
    outputs:
      release_sha: ${{ steps.source.outputs.release_sha }}
      release_version: ${{ steps.source.outputs.release_version }}
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact release tag commit
        id: source
        env:
          EVENT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          release_version="$(python3 dev/set_release_version.py "$RELEASE_TAG")"
          test "$head_sha" = "$EVENT_SHA"
          test "$tag_sha" = "$EVENT_SHA"
          test "$RELEASE_TAG" = "$release_version" || test "$RELEASE_TAG" = "v${release_version}"
          echo "release_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"

  release-python-matrix:
    needs: [verify-release-source]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
      fail-fast: false
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-release-source.outputs.release_sha }}

      - name: Stamp application release metadata
        run: python3 dev/set_release_version.py "${{ needs.verify-release-source.outputs.release_version }}"

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} python -m pytest tests --cov --cov-config=pyproject.toml --cov-report=xml

      - name: Check typing
        if: ${{ matrix.python-version == '3.13' }}
        run: uv run --python ${{ matrix.python-version }} python -m pyright

  release-validation-and-build:
    needs: [verify-release-source]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-release-source.outputs.release_sha }}

      - name: Stamp application release metadata
        run: python3 dev/set_release_version.py "${{ needs.verify-release-source.outputs.release_version }}"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Build and verify the frontend
        run: |
          make frontend
          git diff --exit-code -- frontend/embedded-assets.json mcp_email_server/web_ui/static

      - name: Install the locked Chromium runtime
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run release checks
        run: |
          make check
          make test
          make docs-test
          make test-e2e
          make test-browser

      - name: Build release artifacts once
        run: make build

      - name: Verify the exact release artifacts
        run: make verify-dist

      - name: Record verified artifact checksums
        run: sha256sum dist/* > dist.sha256

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-distributions
          path: |
            dist/*
            dist.sha256

  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      [
        verify-release-source,
        release-python-matrix,
        release-validation-and-build,
      ]
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@v4
        with:
          name: verified-release-distributions

      - name: Verify downloaded artifact checksums
        run: sha256sum --check dist.sha256

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          prune-cache: true

      - name: Publish verified artifacts
        run: uv publish dist/*
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

      - name: Upload dists to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
